# Template for a tm task list. Copy it into lists/ and edit there.
#
#   cp task_list.example.yaml lists/myrun.yaml
#   tm check lists/myrun.yaml     parse without running; see how variables expand
#   tm add   lists/myrun.yaml     add to the queue (a copy into queue/)
#   tm                            start the scheduler (run it inside tmux)
#   tm ls                         progress; works whether or not tm is running
#
# A task runs only if the previous one exited 0. On failure the list stops there and
# that pane is kept so you can attach to it.


# ---------------------------------------------------------------------------
# name: required, no default, never derived from the filename.
#
# It appears in tm ls, in the run directory name and in tmux session names
# (tm-<name>-01-<task>), so letters, digits, '_' and '-' only. Anything else is
# rejected immediately.
# ---------------------------------------------------------------------------
name: myrun


# ---------------------------------------------------------------------------
# cwd: required, no default.
#
# It is the tmux pane's starting directory, and therefore the base for every
# relative path below — both inputs (where train.py and the config are) and outputs
# (where PL's default_root_dir: checkpoints/... actually writes).
#
# A wrong input path fails loudly and immediately. A wrong output path is silent:
# results just land somewhere else. Hence no default; omitting it is an error.
# ---------------------------------------------------------------------------
cwd: ~/YourProject      # your project root. tm checks that it exists, so running
                        # tm check on this template reports cwd not found. Expected.


# ---------------------------------------------------------------------------
# wait: hold until enough GPU is free.
#
# The whole block is optional. Without it the list ignores GPUs and starts as soon
# as it reaches the front of the queue (fine for CPU-only preprocessing).
#
# Cards are held for the whole list: train/test/eval never switch cards and cannot
# be taken over between steps.
# ---------------------------------------------------------------------------
wait:
  # Free VRAM required, in GiB. Use your peak usage plus some headroom.
  gpu_free_gb: 50

  # How many cards. Multiple cards are acquired atomically — all at once or none —
  # so this cannot deadlock.
  gpus: 1

  # Which cards are eligible: any | 1 | [0, 1]
  # To serialise two lists onto one card, give both the same index; different
  # indices run them in parallel. Lanes need no extra configuration.
  gpu_index: any

  # How long the condition must hold continuously, in seconds. This guards against
  # false idle: a job that just started has not built its memory pool yet, so
  # nvidia-smi shows the card as empty and moving in makes both sides OOM.
  stable_for: 120

  # No second tm run may share this card. Set false to allow sharing; tm then bills
  # each run's declared gpu_free_gb against the card's total.
  exclusive: true

  # Give up on this list after waiting this long (marked timeout) and move on.
  # Seconds; 7200 below is two hours. Omit the line to wait forever.
  # The timer lives only in tm's memory, so restarting tm restarts the count.
  # timeout: 7200


# ---------------------------------------------------------------------------
# vars: referenced as {KEY} in commands, so changing a path touches one line.
#       Write {{ }} for literal braces (python f-strings, awk's {{print $1}}).
#       There is no command-line override; fix the values here before running.
#       Referencing an undefined {KEY} is an error, so a typo in a path is never
#       silently passed through.
# ---------------------------------------------------------------------------
vars:
  CFG: config/your_config.yaml
  RUN: baseline


# ---------------------------------------------------------------------------
# tasks: executed top to bottom, one at a time, each blocking the next.
#
# Important: tm only reads exit codes; it does not verify artifacts. Whether one
# step's output is the next step's input is a contract between your commands. Do
# not write guard steps that, say, read a checkpoint's epoch count to confirm
# training finished — they break whenever the artifact changes shape, while the
# exit code is free and shape-independent. Putting train and test in one list is
# all you need.
# ---------------------------------------------------------------------------
tasks:
  # Shortest form: a bare command string, named step1 / step2 / ... automatically.
  # - python prepare.py

  - name: train
    cmd: python train.py --config {CFG}

  # tm has already put the physical index in CUDA_VISIBLE_DEVICES, so the child
  # process only sees 0..gpus-1. Always write --cuda 0 here, and [0] for
  # trainer.devices in the config. (tm checks this before starting, so a mistake
  # does not cost you a six-hour queue wait.)
  - name: test
    cmd: python test.py --config {CFG} --run {RUN} --cuda 0

  - name: eval
    cmd: python eval.py --config {CFG} --run {RUN}
