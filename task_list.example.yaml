# tm 的 task list 模板。抄一份到 lists/ 里改，别就地改这个文件。
#
#   cp task_list.example.yaml lists/myrun.yaml
#   tm check lists/myrun.yaml     只解析不跑，看看变量展开成什么样
#   tm add   lists/myrun.yaml     加进队列（就是 cp 一份进 queue/）
#   tm                            起调度器，消费队列（建议挂在 tmux 里）
#   tm ls                         看进度。tm 在不在跑都能用
#
# 一条 task 跑完且退出码为 0 才跑下一条；哪一步失败就停在那里，
# 后面的不跑，那个 pane 保留现场等你 attach。


# ---------------------------------------------------------------------------
# name: 这个 list 叫什么。缺省用文件名（会自动剥掉 010_ 这类排序前缀）。
#       它会出现在 tm ls 和 tmux 会话名里（tm-<name>-01-<task>），
#       所以只能用字母、数字、下划线、连字符。
# ---------------------------------------------------------------------------
name: myrun


# ---------------------------------------------------------------------------
# cwd: 必填，没有缺省值。
#
# 它是 tmux pane 的起始目录，也就是下面命令里所有相对路径的解析基准——
# 既包括输入（去哪找 train.py、找 config），也包括输出（PL 的
# default_root_dir: checkpoints/... 把 ckpt 写到哪）。
#
# 输入路径写错会立刻 file not found，很吵，好发现；输出路径写错是安静的，
# 结果默默落到别处。所以这里不给缺省值，缺了直接报错。
# ---------------------------------------------------------------------------
cwd: ~/YourProject      # 换成你的项目根目录。tm 会检查它存在，
                        # 所以直接 tm check 这个模板会报 cwd not found，正常。


# ---------------------------------------------------------------------------
# wait: 等到卡够用了再上机。
#
# 整块可以不写——不写就是不管显卡，排到就立刻开跑（适合纯 CPU 的预处理）。
# 抢到的卡整个 list 共用，train/test/eval 不会中途换卡，也不会在步骤之间
# 被别人截胡。
# ---------------------------------------------------------------------------
wait:
  # 要多少空闲显存（GiB）。按你这个任务的峰值占用加点余量填。
  gpu_free_gb: 50

  # 要几张。多张是原子获取——要么一次拿满，要么一张都不拿，所以不会死锁。
  gpus: 1

  # 盯哪几张卡：any | 1 | [0, 1]
  # 想让两个 list 串行跑在同一张卡上，就把它们都写成同一个卡号；
  # 写不同的卡号就是并行。「车道」不用额外配置，从这里自己长出来。
  gpu_index: any

  # 条件要连续满足这么多秒才算数。防的是别人的任务刚启动、显存池还没建起来时
  # 的假空闲——那时候 nvidia-smi 看着卡是空的，冲进去两边一起 OOM。
  stable_for: 120

  # 这张卡不许再放第二个 tm run。改成 false 才允许共享，
  # 共享时 tm 会按各自声明的 gpu_free_gb 记账，不让账面超过总显存。
  exclusive: true

  # 等这么久还没排上就放弃这个 list，去跑后面的。留空 = 一直等。
  # timeout: 7200


# ---------------------------------------------------------------------------
# vars: 命令里用 {KEY} 引用。改一个路径不用改三行命令。
#       命令本身要用花括号时写 {{ }}（python f-string、awk 的 {{print $1}}）。
#       -v KEY=VALUE 可以在命令行覆盖。
# ---------------------------------------------------------------------------
vars:
  CFG: config/your_config.yaml
  RUN: baseline


# ---------------------------------------------------------------------------
# tasks: 从上到下顺序执行，阻塞式——一条跑完才跑下一条。
#
# 重要：tm 只看退出码，不验证产物。「上一步的输出是不是下一步要的输入」
# 是这几条命令之间自己的约定，tm 不管。所以不要写那种「读 ckpt 的 epoch 数
# 确认 train 跑完没」的守卫步骤——产物形状一变就得回来改，而退出码是免费的、
# 跟产物形状无关的。把 train 和 test 放进同一个 list 就够了。
# ---------------------------------------------------------------------------
tasks:
  # 最简写法：直接一行命令，名字自动叫 step1 / step2 ...
  # - python prepare.py

  - name: train
    cmd: python train.py --config {CFG}

  # tm 已经把物理卡号设进 CUDA_VISIBLE_DEVICES 了，子进程眼里只有 0..gpus-1。
  # 所以这里一律写 --cuda 0；config 里的 trainer.devices 同理要写 [0]。
  # （写错了 tm 会在开跑前就查出来，不会等了几小时才报。）
  - name: test
    cmd: python test.py --config {CFG} --run {RUN} --cuda 0

  - name: eval
    cmd: python eval.py --config {CFG} --run {RUN}
